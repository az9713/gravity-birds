<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gravity Birds — Development Journey (demystified)</title>
<script>
(async () => {
  const hash = location.hash;
  const a = await (await fetch("./journey.html.gz.b64.0")).text();
  const b = await (await fetch("./journey.html.gz.b64.1")).text();
  const bin = Uint8Array.from(atob(a + b), c => c.charCodeAt(0));
  const ds = new DecompressionStream("gzip");
  const html = await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();
  document.open();
  document.write(html);
  document.close();
  if (hash) location.hash = hash;
})().catch(e => {
  document.body.textContent = "Failed to load journey: " + e;
});
</script>
</head>
<body>
<p style="font-family:system-ui,sans-serif;padding:2rem;color:#9aa8b8;background:#0f1419;margin:0;min-height:100vh">Loading Gravity Birds development journey…</p>
</body>
</html>
